<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Premium - Nilai Siswa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="admin-panel">
        <div class="admin-header">
            <h1>Panel Admin <span>Guru</span></h1>
            <div style="display: flex; gap: 15px; align-items: center;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 5px;">
                    <i class="fas fa-arrow-left"></i> Kuis
                </a>
                <button id="btn-logout" class="btn-premium danger" style="padding: 6px 12px; font-size: 0.85rem;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 1.05rem;">Pantau nilai dan analisis jawaban siswa secara real-time.</p>
        
        <div class="admin-actions">
            <div class="action-group">
                <button id="btn-refresh" class="btn-premium primary">
                    <i class="fas fa-sync-alt"></i> Muat Ulang
                </button>
                <button id="btn-export" class="btn-premium success">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <select id="sort-select" class="select-premium">
                    <option value="time-desc">Waktu (Terbaru)</option>
                    <option value="time-asc">Waktu (Terlama)</option>
                    <option value="score-desc">Nilai (Tertinggi)</option>
                    <option value="score-asc">Nilai (Terendah)</option>
                </select>
                <select id="items-per-page-select" class="select-premium" style="margin-left: 10px;">
                    <option value="10">10 Baris</option>
                    <option value="20">20 Baris</option>
                    <option value="50">50 Baris</option>
                    <option value="all">Semua</option>
                </select>
            </div>
            <button id="btn-clear" class="btn-premium danger">
                <i class="fas fa-trash-alt"></i> Hapus Semua Data
            </button>
        </div>

        <div class="table-container">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Waktu Selesai</th>
                        <th>No. Absen</th>
                        <th>Nama Siswa</th>
                        <th>Benar</th>
                        <th>Salah</th>
                        <th>Total Nilai</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- Data akan diisi oleh JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="pagination-container" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <div class="pagination-info" style="color: var(--text-muted); font-size: 0.95rem;">
                Menampilkan <span id="page-start">0</span> - <span id="page-end">0</span> dari <span id="total-items">0</span> data
            </div>
            <div class="pagination-controls" style="display: flex; gap: 10px; align-items: center;">
                <button id="btn-prev-page" class="btn-premium primary" style="padding: 6px 12px;" disabled><i class="fas fa-chevron-left"></i></button>
                <span id="page-indicator" style="font-weight: 600; min-width: 90px; text-align: center;">Halaman 1</span>
                <button id="btn-next-page" class="btn-premium primary" style="padding: 6px 12px;" disabled><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Modal for Detailed Answers -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Analisis Jawaban: <span id="modal-student-name" style="color: var(--primary-color);"></span></h2>
                <button class="btn-close" id="btn-close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="answers-grid" id="modal-answers-container">
                    <!-- Answers will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="node_modules/xlsx/dist/xlsx.full.min.js"></script>
    <script src="node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
